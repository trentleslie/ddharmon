name: Publish to PyPI

# Builds the sdist + wheel and uploads them to PyPI when a GitHub Release is
# published. Uses PyPI Trusted Publishing (OIDC) — NO API token is stored.
#
# Releases are cut from the publishing mirror `trentleslie/ddharmon` (Trent owns
# the `ddharmon` PyPI name). Development is canonical in `Phenome-Health/ddharmon`;
# its content is mirrored into the publishing repo before each release.
#
# One-time setup (by a PyPI *owner* of the `ddharmon` project, i.e. Trent):
#   PyPI → project `ddharmon` → Settings → Publishing → Add a trusted publisher:
#     Owner:           trentleslie
#     Repository:      ddharmon
#     Workflow name:   publish.yml
#     Environment:     pypi
#
# Then cut a release: bump the version in pyproject.toml, tag it, and publish a
# GitHub Release (e.g. v0.5.0). This workflow does the rest. See the
# .claude/skills/publish-to-pypi skill for the full procedure.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ddharmon/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
